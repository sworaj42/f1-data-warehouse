services:
  postgres:
    image: postgres:16
    container_name: f1_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # f1_prod is created automatically as the default DB; f1_dw is created by the init script.
      POSTGRES_DB: ${PROD_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${PROD_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
